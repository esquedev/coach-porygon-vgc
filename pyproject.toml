[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "coach-porygon-vgc"
version = "0.2.0"
description = "High-performance GPU-accelerated tensor state machine and tournament simulation engine for Pokémon VGC 4v4 Doubles."
readme = "README.md"
license = { text = "GNU Affero General Public License v3 (AGPLv3)" }
authors = [
    { name = "BeRightVGC / esquedev", email = "esquedevil94@gmail.com" }
]
keywords = [
    "pokemon",
    "vgc",
    "simulation",
    "pytorch",
    "cuda",
    "reinforcement-learning",
    "game-theory",
    "monte-carlo"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]
web = [
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "requests>=2.28.0",
]
all = [
    "coach-porygon-vgc[dev,web]"
]
[project.urls]
Homepage = "https://github.com/esquedev/coach-porygon-vgc"
Repository = "https://github.com/esquedev/coach-porygon-vgc.git"
"Bug Tracker" = "https://github.com/esquedev/coach-porygon-vgc/issues"
[tool.setuptools.packages.find]
where = ["."]
include = ["vgc_tensor_core*", "engine*"]
exclude = ["tests*", "evals*", "assets*"]
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["vgc_tensor_core/tests"]
python_files = ["test_*.py"]
