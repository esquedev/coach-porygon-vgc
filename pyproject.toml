[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "coach-porygon-vgc"
version = "0.2.1"
description = "Non-commercial fan-made GPU-accelerated tensor state machine, Replay Coach Studio, and tournament simulation engine for Pokémon VGC 4v4 Doubles."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "BeRightVGC / esquedev", email = "esquedevil94@gmail.com" }
]
keywords = [
    "pokemon",
    "vgc",
    "simulation",
    "pytorch",
    "cuda",
    "reinforcement-learning",
    "game-theory",
    "monte-carlo"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "duckdb>=2.0.0",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
]
all = [
    "coach-porygon-vgc[dev]"
]
[project.urls]
Homepage = "https://github.com/esquedev/coach-porygon-vgc"
Repository = "https://github.com/esquedev/coach-porygon-vgc.git"
"Bug Tracker" = "https://github.com/esquedev/coach-porygon-vgc/issues"
"Third-Party Notices" = "https://github.com/esquedev/coach-porygon-vgc/blob/main/THIRD_PARTY_NOTICES.md"
[tool.setuptools.packages.find]
where = ["src"]
include = ["engine*"]
exclude = ["tests*", "assets*", "scripts*", "apps*"]
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q --import-mode=importlib"
markers = [
    "acceptance: Acceptance Test & Anti-Hallucination Model Fuzzer gate (required on develop & main)",
]