anti_hallucination {
  feature: "Regulation M-C Anti-Hallucination Guardrails"
  scenarios: [
    {
      name: "Reject Banned Species"
      given {
        banned_sample: [
          "Ursaluna", "Flutter Mane", "Chi-Yu", "Chien-Pao", "Ting-Lu",
          "Iron Bundle", "Iron Hands", "Ogerpon", "Urshifu", "Landorus"
        ]
      }
      when {
        action: "scan_rosters_and_scenarios"
      }
      then {
        allowed_count: 0
      }
    },
    {
      name: "Validate Items Legality"
      given {
        items_csv: "data/Regulation_MC_Items.csv"
      }
      when {
        action: "check_all_roster_items"
      }
      then {
        illegal_count: 0
      }
    }
  ]
}
