[flake8]
max-line-length = 120
extend-ignore = E121, E201, E202, E203, E225, E226, E231, E241, E302, E303, E305, E402, E501, E701, E731, E741, F401, F541, F841, W503, W504
exclude =
    .git,
    __pycache__,
    assets,
    data,
    scratch,
    .venv,
    build,
    dist

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
