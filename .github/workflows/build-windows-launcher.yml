name: Build & Release Windows Studio Launcher (.exe)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  workflow_run:
    workflows: ["Coach Porygon VGC — CI & Acceptance Gate"]
    types: [completed]
    branches: [main]

# Strict least-privilege default: read-only everywhere unless elevated per job
permissions:
  contents: read

jobs:
  verify-main-and-tests:
    name: Verify main Ancestry, Anti-Hallucination & Full Pytest Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository (with full history for main ancestry verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Enforce that release tags (v*) point strictly to a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag ${RELEASE_TAG} is NOT an ancestor of origin/main. Merge into main with passing CI before tagging a Windows .exe release."
            exit 1
          fi
          echo "[OK] Tag ${RELEASE_TAG} verified on origin/main."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & runtime/test dependencies
        if: github.event_name != 'workflow_run'
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Run Anti-Hallucination Scanner, Launcher Check & Full Pytest Suite
        if: github.event_name != 'workflow_run'
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/scan_repo_hallucinations.py
          python scripts/build_windows_launcher.py --check
          pytest tests/ -q

  build-windows-launcher:
    name: Compile CoachPorygonStudio.exe, Sign Provenance & Package Release
    runs-on: windows-latest
    needs: [verify-main-and-tests]
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.13.0"

      - name: Build lightweight CoachPorygonStudio.exe
        run: python scripts/build_windows_launcher.py

      - name: Verify lightweight binary size (< 30 MB)
        shell: pwsh
        run: |
          $exe = Get-Item "dist/CoachPorygonStudio.exe"
          $mb = [math]::Round($exe.Length / 1MB, 2)
          Write-Host "Built CoachPorygonStudio.exe: $mb MB"
          if ($mb -gt 30) {
            Write-Error "Launcher binary unexpectedly exceeded 30 MB ($mb MB)."
            exit 1
          }

      - name: Package CoachPorygonVGC-windows-x64.zip & Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          git archive --format=zip --prefix=CoachPorygonVGC/ -o dist/CoachPorygonVGC-windows-x64.zip HEAD
          python -c "import zipfile; z = zipfile.ZipFile('dist/CoachPorygonVGC-windows-x64.zip', 'a', compression=zipfile.ZIP_DEFLATED); z.write('dist/CoachPorygonStudio.exe', 'CoachPorygonVGC/CoachPorygonStudio.exe'); z.close()"
          $zip = Get-Item "dist/CoachPorygonVGC-windows-x64.zip"
          Write-Host "Packaged bundle: $([math]::Round($zip.Length / 1MB, 2)) MB"
          $exeHash = (Get-FileHash "dist/CoachPorygonStudio.exe" -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash "dist/CoachPorygonVGC-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          @(
            "$exeHash  CoachPorygonStudio.exe"
            "$zipHash  CoachPorygonVGC-windows-x64.zip"
          ) | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Generate GitHub SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/CoachPorygonStudio.exe
            dist/CoachPorygonVGC-windows-x64.zip

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoachPorygonStudio-windows-x64
          path: |
            dist/CoachPorygonStudio.exe
            dist/CoachPorygonVGC-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish public GitHub Release (on verified main v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              dist/CoachPorygonVGC-windows-x64.zip `
              dist/CoachPorygonStudio.exe `
              dist/SHA256SUMS.txt `
              --clobber
          } else {
            gh release create $tag `
              dist/CoachPorygonVGC-windows-x64.zip `
              dist/CoachPorygonStudio.exe `
              dist/SHA256SUMS.txt `
              --title "Coach Porygon VGC $tag" `
              --generate-notes
          }
