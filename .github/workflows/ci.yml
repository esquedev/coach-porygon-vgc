name: Coach Porygon VGC — CI / CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-and-lint:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce PEP 8 style rules on core engine and evals
          flake8 engine/ evals/ scouts/ tests/ --count --max-line-length=120 --statistics

      - name: Run Prompt Guardrails & Static Evals (Mode 7)
        run: |
          python evals/run_static_checks.py

      - name: Run SVG Asset Inventory & XML Audit
        run: |
          python engine/verify_svg_inventory.py

      - name: Run Full Test Suite (pytest)
        run: |
          pytest tests/ --cov=engine --cov-report=term-missing

  validate-build-artifacts:
    name: Build & Validate Distribution Artifacts
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Build & Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Python Distribution Artifacts (sdist & wheel)
        run: |
          python -m build

      - name: Validate Package Metadata & Distribution Integrity (twine)
        run: |
          twine check --strict dist/*

      - name: Verify Artifact Existence & Non-Empty Footprint
        run: |
          echo "Verifying build outputs in dist/..."
          test -f dist/*.whl || (echo "Missing .whl artifact" && exit 1)
          test -f dist/*.tar.gz || (echo "Missing .tar.gz artifact" && exit 1)
          ls -lh dist/
          echo "Verifying Command Center Standalone HTML..."
          test -f assets/command_center.html || (echo "Missing command_center.html" && exit 1)
          test -s assets/command_center.html || (echo "command_center.html is empty" && exit 1)

      - name: Compute Cryptographic SHA-256 Checksums
        run: |
          mkdir -p release_artifacts
          cp dist/* release_artifacts/
          cp assets/command_center.html release_artifacts/coach-porygon-command-center.html
          cd release_artifacts
          sha256sum * > checksums.sha256
          echo "Generated SHA-256 Checksums:"
          cat checksums.sha256

      - name: Upload Build Artifacts (CI Run Retention)
        uses: actions/upload-artifact@v4
        with:
          name: distribution-artifacts
          path: release_artifacts/
          retention-days: 14
