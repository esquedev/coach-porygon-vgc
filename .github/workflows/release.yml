name: Release (Source Bundles + start_replay_coach.bat/.sh)

# Source-only release: NO compiled .exe. Users run the plain-text launchers
# start_replay_coach.bat (Windows) / start_replay_coach.sh (Linux/macOS).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Strict least-privilege default: read-only everywhere unless elevated per job
permissions:
  contents: read

jobs:
  verify:
    name: Verify main Ancestry, Launchers, Anti-Hallucination & Full Pytest Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository (full history for main ancestry verification)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce that release tags (v*) point strictly to a commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Release tag ${RELEASE_TAG} is NOT an ancestor of origin/main. Merge into main with passing CI before tagging a release."
            exit 1
          fi
          echo "[OK] Tag ${RELEASE_TAG} verified on origin/main."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CPU PyTorch & runtime/test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Lint launchers (bash syntax + shellcheck)
        run: |
          bash -n start_replay_coach.sh
          shellcheck -S warning start_replay_coach.sh

      - name: Run Anti-Hallucination Scanner & Full Pytest Suite
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/scan_repo_hallucinations.py
          pytest tests/ -q

  package-release:
    name: Package Source Bundles, Checksums & Provenance
    runs-on: ubuntu-latest
    needs: [verify]
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4

      - name: Build zip (Windows, CRLF .bat) + tar.gz (Linux/macOS, exec bit) bundles & SHA256SUMS.txt
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          git archive --format=zip    --prefix=CoachPorygonVGC/ -o dist/CoachPorygonVGC-windows.zip HEAD
          git archive --format=tar.gz --prefix=CoachPorygonVGC/ -o dist/CoachPorygonVGC-linux-macos.tar.gz HEAD
          # Bundle integrity: launchers present, no .exe, .bat is CRLF, .sh is LF + executable
          unzip -p dist/CoachPorygonVGC-windows.zip CoachPorygonVGC/start_replay_coach.bat | head -c 4096 | grep -q $'\r' \
            || { echo "::error::start_replay_coach.bat lost CRLF line endings"; exit 1; }
          if unzip -l dist/CoachPorygonVGC-windows.zip | grep -qi '\.exe$'; then
            echo "::error::A .exe leaked into the release bundle"; exit 1
          fi
          tar -tvzf dist/CoachPorygonVGC-linux-macos.tar.gz CoachPorygonVGC/start_replay_coach.sh | grep -q '^-rwx' \
            || { echo "::error::start_replay_coach.sh is not executable in the tarball"; exit 1; }
          (cd dist && sha256sum CoachPorygonVGC-windows.zip CoachPorygonVGC-linux-macos.tar.gz > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Generate GitHub SLSA Build Provenance Attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/CoachPorygonVGC-windows.zip
            dist/CoachPorygonVGC-linux-macos.tar.gz

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CoachPorygonVGC-bundles
          path: |
            dist/CoachPorygonVGC-windows.zip
            dist/CoachPorygonVGC-linux-macos.tar.gz
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish public GitHub Release (verified main v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              dist/CoachPorygonVGC-windows.zip \
              dist/CoachPorygonVGC-linux-macos.tar.gz \
              dist/SHA256SUMS.txt \
              --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
          else
            gh release create "$RELEASE_TAG" \
              dist/CoachPorygonVGC-windows.zip \
              dist/CoachPorygonVGC-linux-macos.tar.gz \
              dist/SHA256SUMS.txt \
              --title "Coach Porygon VGC $RELEASE_TAG" \
              --generate-notes \
              --latest \
              --verify-tag
          fi
