name: "Automated Release & Artifact Publishing"

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"

permissions:
  contents: write

jobs:
  gatekeeper-test:
    name: Pre-Release Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Evals & Static Guardrails (Mode 7)
        run: |
          python evals/run_static_checks.py

      - name: Run PNG Asset & Cryptographic SHA-256 Audit
        run: |
          python engine/verify_png_inventory.py

      - name: Run Full Test Suite
        run: |
          pytest tests/ --tb=short

  publish-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    needs: gatekeeper-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build Distribution Packages (sdist & wheel)
        run: |
          python -m build
          twine check --strict dist/*

      - name: Assemble Release Assets & SHA-256 Checksums
        id: assemble
        run: |
          mkdir -p release_assets
          cp dist/*.whl release_assets/
          cp dist/*.tar.gz release_assets/
          cp assets/command_center.html release_assets/coach-porygon-command-center-${{ github.ref_name }}.html
          cp assets/png_manifest.json release_assets/png_manifest.json
          cd release_assets
          sha256sum * > checksums.sha256
          echo "SHA-256 Checksums for Release ${{ github.ref_name }}:"
          cat checksums.sha256

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
